<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <title>Quinta do Jalloto</title>
    <script>
      // Single Page Apps for GitHub Pages (rafgraph/spa-github-pages, MIT).
      // Rewrites /base/produto/x into /base/?/produto/x so index.html can restore it.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
